# Run on every push and pull request.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install production and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-prod.txt
          python -m pip install "pytest>=8.0" "pytest-cov>=5.0" "httpx>=0.27" "PyYAML>=6.0"
      - name: Prepare test data
        run: |
          if [ -d seed ]; then
            cp -r seed data
          else
            echo "seed directory is missing"
            exit 1
          fi
      - name: Tests with coverage
        run: python -m pytest -q --cov=app --cov-report=term-missing
        env:
          LEDGERFORGE_SECRET_KEY: ci-only-test-key-0123456789-abcdefghijklmnop

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t ledgerforge:ci .
      - name: No secret or database inside the image
        run: |
          docker run --rm --entrypoint sh ledgerforge:ci -c '
            for f in /app/.env /app/.secret_key; do test ! -e "$f" || { echo "FOUND $f"; exit 1; }; done
            test -z "$(find /app /var/lib/ledgerforge -name "*.sqlite*" 2>/dev/null)" || { echo "database inside image"; exit 1; }
            echo "image is clean"'
